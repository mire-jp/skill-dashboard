function parseCSV(text) {
  const lines = text.split("\n").filter(l => l.trim()); if (lines.length < 2) return {};
  const goals = {}, latest = {};
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(",").map(c => c.replace(/^"|"$/g, "").trim());
    const ms = MEMBER_ALIASES[cols[1]] || cols[1], si = SKILL_NAME_MAP[cols[2]];
    const target = parseInt(cols[4]?.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))) || 0;
    if (ms && si !== undefined) latest[`${ms}_${si}`] = { memberShort: ms, skillId: si, target, plan: cols[5] || "", current: parseFloat(cols[3]) || 0 };
  }
  for (const d of Object.values(latest)) { if (d.target > 0) { if (!goals[d.memberShort]) goals[d.memberShort] = {}; goals[d.memberShort][d.skillId] = { target: d.target, plan: d.plan, current: d.current }; } }
  return goals;
}
async function fetchGoals() { try { const r = await fetch(SHEET_CSV + "&t=" + Date.now()); return parseCSV(await r.text()); } catch { return {}; } }
async function submitToForm(member, skill, current, target, plan) {
  const body = new URLSearchParams();
  body.append(ENTRY.member, FORM_MEMBER_NAMES[member] || member);
  body.append(ENTRY.skill, `${skill.id + 1}. ${skill.name}`);
  body.append(ENTRY.current, String(current || 0));
  body.append(ENTRY.target, String(target || 0));
  body.append(ENTRY.plan, plan || "");
  await fetch(FORM_URL, { method: "POST", body, mode: "no-cors" });
}

function parseScoreCSV(text) {
  const out = {};
  const lines = text.split("\n").filter(l => l.trim());
  if (lines.length < 2) return out;
  const latest = {}; // key: target||skillId||rater -> {target, skillId, rater, level}
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(",").map(c => c.replace(/^"|"$/g, "").trim());

    const target = MEMBER_ALIASES[cols[1]] || cols[1];
    const skillId = SKILL_NAME_MAP[cols[2]];
    const rater = MEMBER_ALIASES[cols[3]] || cols[3];
    const level = parseInt(toHalf(cols[4]), 10);
    if (!target || skillId === undefined || !rater || !level) continue;
    latest[`${target}||${skillId}||${rater}`] = { target, skillId, rater, level };
  }

    if (rater === target) out[target][skillId].self = level;
    else out[target][skillId].peers[rater] = level;
  }
  return out;
}

// クオート対応CSVパーサ（自由記述に含まれるカンマ・改行・"" を正しく処理）
function parseCSVRows(text) {
  const rows = []; let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { row.push(field); field = ""; }
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (ch === '\r') { /* skip CR */ }
      else field += ch;
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}
// 列順: [タイムスタンプ, 被評価者, 役職・ポジション, 担当エリア, 担当ブランド・部署, 周辺知識・経験, 備考]
// 返り値: { [メンバーshort]: { role, area, brand, knowledge, note } } ＝ メンバーごと最新行
function parseProfileCSV(text) {
  const out = {};
  const rows = parseCSVRows(text);
  if (rows.length < 2) return out;
  for (let i = 1; i < rows.length; i++) {
    const cols = rows[i];
    if (!cols || cols.length < 2) continue;
    const ms = MEMBER_ALIASES[(cols[1] || "").trim()] || (cols[1] || "").trim();
    if (!ms) continue;
    out[ms] = {
      role: (cols[2] || "").trim(), area: (cols[3] || "").trim(), brand: (cols[4] || "").trim(),
      knowledge: (cols[5] || "").trim(), note: (cols[6] || "").trim(),
    }; // 後の行で上書き＝最新行採用
  }
  return out;
}
async function fetchProfiles() { try { const r = await fetch(PROFILE_CSV + "&t=" + Date.now()); return parseProfileCSV(await r.text()); } catch { return {}; } }
async function submitProfile(short, p) {

const PERIOD_KEY = "skillmatrix_period_v1";
// スキル列の見出し＝Notion既存DBの列名に完全一致（ダッシュボード内部名とは別）
const NOTION_SKILL_COLS = [
  "1. AIクリエイティブツール", "2. AIエージェント設計・構築", "3. AI実装・運用",
  "4. コーディング / アプリケーション開発", "5. 外部データ連携設計", "6. 業務ワークフロー設計",
  "7. 研修・ガイド資料作成", "8. プロジェクトマネジメント", "9. ヒアリング・要件整理・提案",
  "10. 生産", "11. 企画", "12. 販売", "13. 経営＆管理",
];
const csvCell = (s) => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
function exportCSV(data, profiles) {
  let period = "69期1Q";
  try { period = localStorage.getItem(PERIOD_KEY) || period; } catch {}
  const input = window.prompt("どの期のスナップショットですか？（例：69期1Q）", period);
  if (input == null) return; // キャンセル
  period = input.trim() || period;
  try { localStorage.setItem(PERIOD_KEY, period); } catch {}

  const header = ["メンバー名", "期", "最新", "役職・ポジション", "担当エリア", "担当ブランド・部署", "周辺知識・経験", "備考", ...NOTION_SKILL_COLS];
  let csv = header.map(csvCell).join(",") + "\n";
  data.forEach(m => {
    const p = profiles[m.short] || {};
    const text = [m.name, period, "最新", p.role || "", p.area || "", p.brand || "", p.knowledge || "", p.note || ""].map(csvCell);
    const combos = SKILLS.map((_, i) => {
      const s = m.self[i], pe = m.peer[i];
      const v = (s != null && pe != null) ? +((s + pe) / 2).toFixed(1) : (s != null ? s : (pe != null ? pe : null));
      return v == null ? "" : (Number.isInteger(v) ? String(v) : v.toFixed(1)); // 総合（数値・小数あり）
    });
    csv += text.concat(combos).join(",") + "\n";
  });
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `skill_matrix_${period}_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
}

              <div key={sid} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 10px", marginBottom: 2, background: selSkill === +sid ? "#1e2a3a" : "transparent", borderRadius: 6 }}>

                    : gap > 0 && <div style={{ fontSize: 9, color: "#f59e0b", background: "#f59e0b15", padding: "1px 5px", borderRadius: 3 }}>+{gap.toFixed(1)}</div>}
                </div>

              </div>); })}
          </div>}
          {canEdit && <div style={{ marginTop: 20, display: "flex", gap: 10, justifyContent: "flex-end", alignItems: "center" }}>

              {saving ? "⏳ 保存中..." : saved ? "✓ 保存済み" : "💾 保存する"}
            </button>
          </div>}
        </div>
      </div>
    </div>
  );
}

// 担当エリア／担当ブランド・部署の選択肢（Notion既存マルチセレクトと完全一致）
const AREA_OPTIONS = ["チームビルド", "コンテンツ発信", "研修", "データテック", "システム", "クリエイティブ"];
const BRAND_OPTIONS = ["人事（研修）", "ワールドブランズ", "F3", "生産指導部", "FCL", "DCX", "IR・グループコミュニケーション室", "法務・品質統制部", "人事（労務）", "システムソリューション", "all new mart", "& Bridge", "ASPLUND", "CODE A", "GALLEST", "cloenc", "index", "ITS DEMO", "adabat", "UNTITLED", "tk. TAKEO KIKUCHI"];
const splitVals = (s) => (s || "").split(",").map(x => x.trim()).filter(Boolean);

function ProfileView({ profiles, rater, raterName, onRequestIdentity, applyProfile }) {
  const FIELDS = [
    { key: "role", label: "役職・ポジション", type: "text", ph: "例：PMO / デザイナー / インターン" },
    { key: "area", label: "担当エリア", type: "multi", opts: AREA_OPTIONS },
    { key: "brand", label: "担当ブランド・部署", type: "multi", opts: BRAND_OPTIONS },
    { key: "knowledge", label: "周辺知識・経験", type: "textarea", ph: "業界経験・得意領域・前職など" },
    { key: "note", label: "備考", type: "textarea", ph: "その他、共有しておきたいこと" },
  ];
  const [form, setForm] = useState({});
  const [dirty, setDirty] = useState(false);
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  useEffect(() => { setForm({ ...(profiles[rater] || {}) }); setDirty(false); }, [rater]);
  useEffect(() => { setForm(f => dirty ? f : { ...(profiles[rater] || {}) }); }, [profiles]);
  const upd = (k, v) => { setForm(p => ({ ...p, [k]: v })); setDirty(true); setSaved(false); };
  const toggleChip = (k, opt) => { const cur = splitVals(form[k]); const next = cur.includes(opt) ? cur.filter(x => x !== opt) : [...cur, opt]; upd(k, next.join(", ")); };
  const handleSave = async () => {
    if (!rater) return;
    setSaving(true);
    try { await submitProfile(rater, form); if (applyProfile) applyProfile(rater, form); setDirty(false); setSaved(true); setTimeout(() => setSaved(false), 2500); }
    catch (e) { console.error(e); }
    setSaving(false);
  };

  if (!rater) {
    return (
      <div style={{ background: "#1e2a3a", border: "1px solid #6366f140", borderRadius: 10, padding: 20, fontSize: 13, color: "#93c5fd", lineHeight: 1.7 }}>
        👤 補足情報を入力するには、まず「あなたは誰か」を選んでください。
        <button onClick={onRequestIdentity} style={{ marginLeft: 10, padding: "5px 12px", borderRadius: 6, border: "1px solid #6366f1", background: "#6366f1", color: "#fff", cursor: "pointer", fontSize: 12, fontFamily: "inherit", fontWeight: 600 }}>自分を選択</button>
      </div>
    );
  }

  return (
    <div>
      <div style={{ background: "#1a1a2e", borderRadius: 10, border: "1px solid #6366f140", overflow: "hidden", marginBottom: 20 }}>
        <div style={{ padding: "14px 18px", borderBottom: "1px solid #1e1e30" }}>
          <div style={{ fontSize: 14, fontWeight: 700, color: "#a5b4fc" }}>🙋 {raterName} さんの補足情報</div>
          <p style={{ fontSize: 11, color: "#64748b", margin: "4px 0 0", lineHeight: 1.6 }}>自分の分のみ編集できます。ここで保存した内容は、AIがチーム編成やタスク割り当ての参考にします（NotionへはCSVで反映）。</p>
        </div>
        <div style={{ padding: "16px 18px" }}>
          {FIELDS.map(f => (
            <div key={f.key} style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 11, color: "#94a3b8", marginBottom: 5, fontWeight: 600 }}>{f.label}{f.type === "multi" && <span style={{ color: "#475569", fontWeight: 400 }}>（複数選択可）</span>}</div>
              {f.type === "multi"
                ? <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                    {f.opts.map(opt => { const on = splitVals(form[f.key]).includes(opt); return (
                      <button key={opt} onClick={() => toggleChip(f.key, opt)} style={{ padding: "5px 11px", borderRadius: 14, border: `1px solid ${on ? "#6366f1" : "#2a2a3e"}`, background: on ? "#6366f120" : "#1a1a2e", color: on ? "#a5b4fc" : "#94a3b8", cursor: "pointer", fontSize: 11, fontFamily: "inherit", fontWeight: 500 }}>{on ? "✓ " : ""}{opt}</button>
                    ); })}
                  </div>
                : f.type === "textarea"
                ? <textarea value={form[f.key] || ""} onChange={e => upd(f.key, e.target.value)} placeholder={f.ph} style={{ width: "100%", minHeight: 70, background: "#0f0f1a", border: "1px solid #2a2a3e", borderRadius: 6, padding: "8px 10px", color: "#e2e8f0", fontSize: 12, fontFamily: "inherit", lineHeight: 1.6, resize: "vertical", outline: "none" }} />
                : <input value={form[f.key] || ""} onChange={e => upd(f.key, e.target.value)} placeholder={f.ph} style={{ width: "100%", background: "#0f0f1a", border: "1px solid #2a2a3e", borderRadius: 6, padding: "8px 10px", color: "#e2e8f0", fontSize: 12, fontFamily: "inherit", outline: "none" }} />}
            </div>
          ))}
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", alignItems: "center" }}>
            {saved && <span style={{ fontSize: 12, color: "#4ade80" }}>✓ 保存しました</span>}
            <button onClick={handleSave} disabled={saving} style={{ padding: "10px 26px", borderRadius: 8, border: "none", cursor: saving ? "wait" : "pointer", fontSize: 13, fontWeight: 700, fontFamily: "inherit", background: saved ? "#0f3a2e" : "#6366f1", color: saved ? "#4ade80" : "#fff", opacity: saving ? 0.7 : 1 }}>{saving ? "⏳ 保存中..." : saved ? "✓ 保存済み" : "💾 保存する"}</button>
          </div>
          <div style={{ marginTop: 8, fontSize: 10, color: "#475569" }}>保存後、他のメンバーの画面に反映するには上部「🔄 再読込」を押してください。反映に数分かかることがあります。</div>
        </div>
      </div>

      <div style={{ fontSize: 12, fontWeight: 700, color: "#6ee7b7", marginBottom: 8 }}>👥 チーム全員の補足情報（参照）</div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 10 }}>
        {MEMBERS.map(m => { const p = profiles[m.short] || {}; const has = p.role || p.area || p.brand || p.knowledge || p.note; return (
          <div key={m.short} style={{ background: "#1a1a2e", borderRadius: 10, padding: 14, border: `1px solid ${m.short === rater ? "#6366f140" : "#2a2a3e"}` }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: "#f8fafc", marginBottom: 6 }}>{m.name}{m.short === rater && <span style={{ fontSize: 9, color: "#a5b4fc", marginLeft: 6 }}>（あなた）</span>}</div>
            {has ? <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              {[["役職・ポジション", p.role], ["担当エリア", p.area], ["担当ブランド・部署", p.brand], ["周辺知識・経験", p.knowledge], ["備考", p.note]].map(([l, v]) => v ? (
                <div key={l} style={{ fontSize: 11, lineHeight: 1.5 }}><span style={{ color: "#64748b" }}>{l}：</span><span style={{ color: "#e2e8f0", whiteSpace: "pre-wrap" }}>{v}</span></div>
              ) : null)}
            </div> : <div style={{ fontSize: 11, color: "#475569" }}>未入力</div>}
          </div>
        ); })}
      </div>
    </div>
  );
}

// ===== Main App =====
function App() {
  const [view, setView] = useState("heatmap");
  const [skill, setSkill] = useState(null);
  const [hov, setHov] = useState(null);
  const [mode, setMode] = useState("combined");
  const [goalPanel, setGoalPanel] = useState(null);
  const [goals, setGoals] = useState({});
  const [loading, setLoading] = useState(true);

  // スコア関連の状態
  const [csvScores, setCsvScores] = useState({});
  const [rater, setRater] = useState(loadRater());
  const [identityPrompt, setIdentityPrompt] = useState(false);
  const [scorePanel, setScorePanel] = useState(null);
  const [profiles, setProfiles] = useState({});

  const raterName = rater ? (MEMBERS.find(m => m.short === rater)?.name || rater) : null;

  // CSVスコア＋ハードコードのフォールバックをマージ
  const data = useMemo(() => MEMBERS.map(m => {
    const cs = csvScores[m.short] || {};
    const hpeer = peerAvgHardcoded(m.short);
    const self = SKILLS.map((_, i) => { const v = cs[i]?.self; return (v != null) ? v : (m.self[i] || null); });
    const peer = SKILLS.map((_, i) => {
      const ps = cs[i]?.peers ? Object.values(cs[i].peers) : [];
      if (ps.length) return +(ps.reduce((a,b)=>a+b,0)/ps.length).toFixed(1);
      return hpeer[i] != null ? hpeer[i] : null;
    });
    return { ...m, self, peer };
  }), [csvScores]);

  const score = useCallback((m, i) => { const s = m.self[i] || null, p = m.peer[i]; if (mode === "self") return s; if (mode === "peer") return p; return s && p ? +((s + p) / 2).toFixed(1) : s || p || null; }, [mode]);

  useEffect(() => {
    fetchGoals().then(g => { setGoals(g); setLoading(false); });
    fetchScores().then(setCsvScores);
    fetchProfiles().then(setProfiles);
    if (!loadRater()) setIdentityPrompt(true);
  }, []);

  const refreshAll = async () => { setLoading(true); const [g, s, p] = await Promise.all([fetchGoals(), fetchScores(), fetchProfiles()]); setGoals(g); setCsvScores(s); setProfiles(p); setLoading(false); };

  // スコア入力モード制御
  const pickIdentity = (short) => { setRater(short); saveRater(short); setIdentityPrompt(false); };
  const resetIdentity = () => { clearRater(); setRater(null); };
  const applyProfile = (short, p) => { setProfiles(prev => ({ ...prev, [short]: { ...p } })); };
  const applyScore = (target, skillId, r, level) => {
    setCsvScores(prev => {
      const next = { ...prev };
      const cell = { ...(next[target]?.[skillId] || { self: null, peers: {} }) };
      cell.peers = { ...cell.peers };
      if (r === target) cell.self = level; else cell.peers[r] = level;
      next[target] = { ...(next[target] || {}), [skillId]: cell };
      return next;
    });
  };
  // クリック時のルーティング（モードで分岐）
  const openCell = (m, skillId = null) => { if (!rater) { setIdentityPrompt(true); return; } if (m.short === rater) setGoalPanel({ member: m, initialSkill: skillId ?? undefined }); else setScorePanel({ member: m, initialSkill: skillId ?? undefined }); };

  const GoalDot = ({ member }) => { const c = Object.keys(goals[member.short]||{}).filter(k => goals[member.short][k]?.target).length; return c ? <span style={{ display: "inline-block", width: 6, height: 6, borderRadius: 3, background: "#f59e0b", marginLeft: 4, verticalAlign: "middle" }} title={`${c}件`} /> : null; };
  const Mode = ({ k, l }) => <button onClick={() => setMode(k)} style={{ padding: "4px 10px", borderRadius: 5, border: "none", cursor: "pointer", fontSize: 10, fontWeight: 600, fontFamily: "inherit", background: mode === k ? "#334155" : "transparent", color: mode === k ? "#e2e8f0" : "#64748b" }}>{l}</button>;

  return (
    <div style={{ fontFamily: "'Noto Sans JP',sans-serif", background: "#0f0f1a", color: "#e2e8f0", minHeight: "100vh", padding: 20 }}>
      <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600;700&display=swap" rel="stylesheet" />
      <div style={{ maxWidth: 1200, margin: "0 auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8 }}>
          <div>
            <div style={{ fontSize: 10, fontWeight: 600, letterSpacing: 3, color: "#6366f1", textTransform: "uppercase" }}>AI Initiative Team</div>
            <h1 style={{ fontSize: 22, fontWeight: 700, margin: "2px 0 4px", color: "#f8fafc" }}>スキルマトリクス</h1>
            <p style={{ fontSize: 11, color: "#64748b", margin: "0 0 14px" }}>上段＝あなたの自己評価＆目標／下段＝メンバーへの他者評価。セルをクリックして入力します。</p>
          </div>
          <div style={{ display: "flex", gap: 6, marginTop: 10, alignItems: "center", flexWrap: "wrap" }}>
            {rater ? <span style={{ fontSize: 10, color: "#94a3b8", background: "#1a1a2e", border: "1px solid #2a2a3e", borderRadius: 6, padding: "5px 8px" }}>入力者: <b style={{ color: "#e2e8f0" }}>{raterName}</b> <span onClick={resetIdentity} style={{ color: "#6366f1", cursor: "pointer", marginLeft: 4 }}>別の人として使う</span></span> : <button onClick={() => setIdentityPrompt(true)} style={{ padding: "6px 12px", borderRadius: 6, border: "1px solid #6366f1", background: "#6366f1", color: "#fff", cursor: "pointer", fontSize: 11, fontFamily: "inherit", fontWeight: 600 }}>🙋 あなたを選択</button>}
            <button onClick={() => exportCSV(data, profiles)} style={{ padding: "6px 12px", borderRadius: 6, border: "1px solid #2a2a3e", background: "#1a1a2e", color: "#94a3b8", cursor: "pointer", fontSize: 11, fontFamily: "inherit" }}>📥 CSV</button>
            <button onClick={refreshAll} disabled={loading} style={{ padding: "6px 12px", borderRadius: 6, border: "1px solid #2a2a3e", background: "#1a1a2e", color: loading ? "#64748b" : "#94a3b8", cursor: "pointer", fontSize: 11, fontFamily: "inherit" }}>{loading ? "読込中..." : "🔄 再読込"}</button>
          </div>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 14 }}>
          <div style={{ display: "flex", gap: 2, background: "#1a1a2e", borderRadius: 8, padding: 3, flexWrap: "wrap" }}>
            {[["heatmap","ヒートマップ"],["profile","補足情報入力"],["defs","スキル定義"],["manual","マニュアル"]].map(([k,l]) =>
              <Pill key={k} active={view===k} onClick={() => { setView(k); setSkill(null); }}>{l}</Pill>
            )}
          </div>
          {!["defs","manual","profile"].includes(view) && <div style={{ display: "flex", gap: 2, background: "#1a1a2e", borderRadius: 8, padding: 3, alignItems: "center" }}>
            <span style={{ fontSize: 10, color: "#64748b", padding: "0 6px" }}>表示：</span>
            <Mode k="combined" l="総合" /><Mode k="self" l="自己" /><Mode k="peer" l="他者" />
          </div>}
        </div>

        {/* HEATMAP : 上段=自分 / 下段=メンバー */}
        {view === "heatmap" && (() => {
          const me = rater ? data.find(m => m.short === rater) : null;
          const others = data.filter(m => !rater || m.short !== rater);
          const SkillHead = () => <thead><tr><th style={{ width: 92 }} />{SKILLS.map(sk => <th key={sk.id} onClick={() => setSkill(skill === sk.id ? null : sk.id)} style={{ padding: "4px 2px", fontSize: 9, color: skill === sk.id ? "#f8fafc" : "#94a3b8", cursor: "pointer", textAlign: "center", writingMode: "vertical-rl", height: 64, background: skill === sk.id ? "#6366f115" : "transparent", borderRadius: 3, borderBottom: `2px solid ${cc(sk.cat)}30` }}>{sk.short}</th>)}</tr></thead>;
          const Row = ({ m, useSelf, accent }) => (
            <tr>
              <td style={{ padding: "3px 5px", fontSize: 11, fontWeight: 600, whiteSpace: "nowrap", cursor: "pointer" }} onClick={() => openCell(m)}>
                <span style={{ color: "#f8fafc", borderBottom: "1px dashed #334155" }}>{m.short}</span><GoalDot member={m} />
                <span style={{ fontSize: 9, color: "#64748b", marginLeft: 4 }}>{m.role}</span>
              </td>
              {SKILLS.map((_, si) => { const v = useSelf ? (m.self[si] || null) : score(m, si); const c = cb(v); const h = hov?.ms === m.short && hov?.s === si; const g = goals[m.short]?.[si]?.target; return (
                <td key={si} onMouseEnter={() => setHov({ ms: m.short, s: si })} onMouseLeave={() => setHov(null)} onClick={() => openCell(m, si)}
                  style={{ textAlign: "center", padding: "4px 1px", fontSize: 11, fontWeight: 700, background: c.bg, color: c.text, borderRadius: 3, border: `1px solid ${accent ? accent : (g ? "#f59e0b50" : c.bd)}`, position: "relative", transform: h ? "scale(1.15)" : "scale(1)", zIndex: h ? 10 : 1, transition: "all .1s", boxShadow: h ? `0 0 10px ${c.text}30` : "none", cursor: "pointer" }}>
                  {fmt(v)}{g && <div style={{ position: "absolute", top: -2, right: -2, width: 5, height: 5, borderRadius: 3, background: "#f59e0b" }} />}
                  {h && <div style={{ position: "absolute", bottom: "calc(100% + 4px)", left: "50%", transform: "translateX(-50%)", background: "#1e293b", border: "1px solid #334155", borderRadius: 5, padding: "5px 9px", fontSize: 10, whiteSpace: "nowrap", color: "#e2e8f0", zIndex: 100, boxShadow: "0 4px 12px rgba(0,0,0,.6)" }}>
                    <div style={{ fontWeight: 700, marginBottom: 2 }}>{SKILLS[si].short}</div>
                    <div>自己: {m.self[si]||"—"} | 他者: {m.peer[si]!=null?m.peer[si].toFixed(1):"—"}</div>
                    {g && <div style={{ color: "#f59e0b", marginTop: 2 }}>🎯 目標: Lv{g}</div>}
                    <div style={{ color: "#a5b4fc", marginTop: 2 }}>クリックで入力</div>
                  </div>}
                </td>); })}
            </tr>
          );
          return (
          <div>
            {!rater && <div style={{ marginBottom: 14, padding: "12px 14px", borderRadius: 10, background: "#1e2a3a", border: "1px solid #6366f140", fontSize: 12, color: "#93c5fd" }}>👤 まず「あなたは誰か」を選ぶと、上段にあなた専用の入力欄（自己評価＆目標）が出ます。<button onClick={() => setIdentityPrompt(true)} style={{ marginLeft: 8, padding: "4px 10px", borderRadius: 6, border: "1px solid #6366f1", background: "#6366f1", color: "#fff", cursor: "pointer", fontSize: 11, fontFamily: "inherit", fontWeight: 600 }}>あなたを選択</button></div>}
            {me && <div style={{ marginBottom: 20 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "#a5b4fc", marginBottom: 6 }}>🙋 あなたのスキル（{mode === "self" ? "自己評価" : mode === "peer" ? "他者評価" : "総合"}＆目標）</div>
              <div style={{ overflowX: "auto", border: "1px solid #6366f140", borderRadius: 10, padding: 8, background: "#12121f" }}>
                <table style={{ borderCollapse: "separate", borderSpacing: 2, width: "100%" }}><SkillHead /><tbody><Row m={me} useSelf={false} accent="#6366f180" /></tbody></table>
              </div>
            </div>}
            <div>
              <div style={{ fontSize: 12, fontWeight: 700, color: "#6ee7b7", marginBottom: 6 }}>👥 チームメンバー（他者評価を入力）</div>
              <div style={{ overflowX: "auto" }}>
                <table style={{ borderCollapse: "separate", borderSpacing: 2, width: "100%" }}><SkillHead /><tbody>{others.map(m => <Row key={m.short} m={m} useSelf={false} />)}</tbody></table>
              </div>
            </div>
            <div style={{ display: "flex", gap: 10, marginTop: 12, justifyContent: "center", flexWrap: "wrap" }}>
              {[1,2,3,4,5].map(v => <div key={v} style={{ display: "flex", alignItems: "center", gap: 3 }}><div style={{ width: 15, height: 15, borderRadius: 2, ...(() => { const c = cb(v); return { background: c.bg, border: `1px solid ${c.bd}`, color: c.text }; })(), display: "flex", alignItems: "center", justifyContent: "center", fontSize: 9, fontWeight: 700 }}>{v}</div><span style={{ fontSize: 9, color: "#94a3b8" }}>{LEVELS[v]}</span></div>)}
              <div style={{ display: "flex", alignItems: "center", gap: 3 }}><div style={{ width: 6, height: 6, borderRadius: 3, background: "#f59e0b" }} /><span style={{ fontSize: 9, color: "#94a3b8" }}>目標設定済み</span></div>
            </div>
          </div>
          );
        })()}

        {/* PROFILE（補足情報入力） */}
        {view === "profile" && <ProfileView profiles={profiles} rater={rater} raterName={raterName} onRequestIdentity={() => setIdentityPrompt(true)} applyProfile={applyProfile} />}

        {/* SKILL DEFINITIONS */}
        {view === "defs" && <SkillDefsView />}

        {/* MANUAL */}
        {view === "manual" && <ManualView />}
      </div>
      {goalPanel && <GoalPanel member={goalPanel.member} initialSkill={goalPanel.initialSkill} onClose={() => setGoalPanel(null)} goals={goals} setGoals={setGoals} score={score} rater={rater} raterName={raterName} csvScores={csvScores} applyScore={applyScore} onRequestIdentity={() => setIdentityPrompt(true)} />}
      {scorePanel && rater && <ScorePanel member={scorePanel.member} initialSkill={scorePanel.initialSkill} rater={rater} raterName={raterName} onClose={() => setScorePanel(null)} csvScores={csvScores} applyScore={applyScore} />}
      {identityPrompt && <IdentityPrompt onPick={pickIdentity} onClose={() => setIdentityPrompt(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
